<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <div class="container">
            <div class="form-col">
                <label for="fName">First Name</label>
                <input type="text" name="" id="fName" required>


                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="alex@gmail.com" required>

                <label for="contact">Phone Number</label>
                <input type="tel" name="contact" id="contact" 
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}"
                 placeholder="000-888-222">

                 <label for="date">DOB</label>
                 <input type="date" name="date" id="date">

                  <label for="month">DOB</label>
                 <input type="month" name="month" id="month">

                  <label for="time">DOB</label>
                 <input type="time" name="time" id="time">
            </div>
            <div class="form-col">
                <label for="lName">Last Name</label>
                <input type="text" name="" id="lName">

                <label for="password">Password</label>
                <input type="password" name="password" id="password">

                <label for="age">Age</label>
                <input type="number" name="Age" id="Age">

                <p>Gender</p>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male">
                <label for="Female">Female</label>
                <input type="radio" name="gender" id="Female">
                <label for="others">Others</label>
                <input type="radio" name="gender" id="others">

<hr>
<br>
                <p>Agree or Disagreee</p>
                <div class="">
                    <label for="agree">Agreee</label>
                <input type="checkbox" name="terms" id="agree">

                <label for="disagree">Agreee</label>
                <input type="checkbox" name="terms" id="disagree">
                </div>
            </div>
        </div>
        <div class="">
            <button type="submit">Submit</button>
        </div>
    </form>

</body>
</html>
